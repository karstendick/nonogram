name: Delete Merged Branch

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    # Only run if the PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete merged branch
        id: delete-branch
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Don't delete main or master branches
            if (branchName === 'main' || branchName === 'master') {
              console.log(`Skipping deletion of protected branch: ${branchName}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branchName}`
              });
              console.log(`Successfully deleted branch: ${branchName}`);
              return branchName;
            } catch (error) {
              // Branch might already be deleted or might be from a fork
              console.log(`Could not delete branch ${branchName}: ${error.message}`);
              return null;
            }
          result-encoding: string

      - name: Checkout repository
        if: steps.delete-branch.outputs.result != 'null'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cleanup preview deployment
        if: steps.delete-branch.outputs.result != 'null'
        uses: ./.github/actions/cleanup-preview
        with:
          branch-name: ${{ steps.delete-branch.outputs.result }}
